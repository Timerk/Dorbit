[preset.0]
name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="assets/ships/catalog.json,assets/sector/outpost-01-collision.json,assets/skylab/balance-v1.json"
exclude_filter="tests/*,tools/*,*.md,*-results.json"
export_path="build/windows/Dorbit.exe"
encryption_include_filters=""
