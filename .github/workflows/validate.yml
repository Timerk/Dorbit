name: Validate Windows client and Linux server

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Each PR cancels only its own obsolete validation; main builds are independent.
concurrency:
  group: validate-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.changes.outputs.build }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test CI helpers
        run: python3 -m unittest discover -s tests -p 'ci_performance_test.py' -v
      - id: changes
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 tools/ci-changes.py

  linux-server:
    needs: changes
    env:
      DORBIT_TEST_WORKERS: 2
    runs-on: ubuntu-latest
    # Validate the exact release copy once, including a cold import on cache misses.
    timeout-minutes: 30
    steps:
      - name: Documentation-only validation
        if: needs.changes.outputs.build != 'true'
        shell: bash
        run: echo "Documentation-only PR; game builds skipped." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: needs.changes.outputs.build == 'true'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: needs.changes.outputs.build == 'true'
        with:
          path: .tools/godot-linux
          key: godot-linux-4.7.2-v2
      - name: Set up pinned Linux Godot
        if: needs.changes.outputs.build == 'true'
        run: bash tools/server.sh setup
      - name: Compute import inputs
        if: needs.changes.outputs.build == 'true'
        id: import-key
        run: echo "key=$(python3 tools/import-cache.py key)" >> "$GITHUB_OUTPUT"
      - name: Cache imported Linux assets
        if: needs.changes.outputs.build == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ci/import-cache
          key: imports-v2-${{ runner.os }}-godot-4.7.2-${{ steps.import-key.outputs.key }}
          restore-keys: imports-v2-${{ runner.os }}-godot-4.7.2-
      - name: Test deployment safety
        if: needs.changes.outputs.build == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y age
          python3 -m unittest discover -s tests -p 'deployment_test.py' -v
          python3 -m unittest discover -s tests -p 'ci_deploy_test.py' -v
          python3 -m unittest discover -s tests -p 'ci_packaging_test.py' -v
      - name: Package checked Linux release
        if: needs.changes.outputs.build == 'true'
        env:
          DORBIT_VALIDATED_IMPORT_CACHE: ${{ github.workspace }}/.ci/import-cache
        run: |
          bash tools/deploy-server.sh "$GITHUB_SHA"
          tar -czf server.tar.gz -C "build/server-releases/$GITHUB_SHA" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: needs.changes.outputs.build == 'true'
        with:
          name: Dorbit-Linux-${{ github.sha }}-${{ github.run_attempt }}
          path: server.tar.gz
          if-no-files-found: error
          compression-level: 0
  windows:
    needs: changes
    env:
      DORBIT_TEST_WORKERS: 2
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Documentation-only validation
        if: needs.changes.outputs.build != 'true'
        shell: bash
        run: echo "Documentation-only PR; game builds skipped." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: needs.changes.outputs.build == 'true'
      - name: Test local offline launcher
        if: needs.changes.outputs.build == 'true'
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tests/local_launcher_test.ps1
      - name: Cache pinned Godot tools
        if: needs.changes.outputs.build == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .tools/godot
            .tools/templates
          key: godot-windows-4.7.2-v1
      - name: Compute import inputs
        if: needs.changes.outputs.build == 'true'
        id: import-key
        shell: pwsh
        run: '"key=$(python tools/import-cache.py key)" >> $env:GITHUB_OUTPUT'
      - name: Cache imported Windows assets
        if: needs.changes.outputs.build == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .ci/import-cache
          key: imports-v2-${{ runner.os }}-godot-4.7.2-${{ steps.import-key.outputs.key }}
          restore-keys: imports-v2-${{ runner.os }}-godot-4.7.2-
      - name: Set up Godot
        if: needs.changes.outputs.build == 'true'
        shell: pwsh
        run: ./tools/dev.ps1 setup
      - name: Seed validated imports
        if: needs.changes.outputs.build == 'true'
        run: python tools/import-cache.py prepare
      - name: Import and test the encounter
        if: needs.changes.outputs.build == 'true'
        shell: pwsh
        run: ./tools/dev.ps1 check
      - name: Export Windows build
        if: needs.changes.outputs.build == 'true'
        shell: pwsh
        run: |
          ./tools/dev.ps1 build
          [IO.File]::WriteAllText("$PWD/build/windows/REVISION", "$env:GITHUB_SHA`n")
          Compress-Archive -Path build/windows/* -DestinationPath windows.zip
      - name: Capture successful imports
        if: needs.changes.outputs.build == 'true'
        run: python tools/import-cache.py capture
      - name: Upload playable build
        if: needs.changes.outputs.build == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Dorbit-Windows-${{ github.sha }}-${{ github.run_attempt }}
          path: windows.zip
          if-no-files-found: error
          compression-level: 0

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [linux-server, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download packages without extracting artifact paths
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/ci-deploy.py release-download
          python3 tools/ci-deploy.py release-manifest
      - name: Attest exact packages and manifest from this main build
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            dist/server.tar.gz
            dist/windows.zip
            dist/manifest.json
      - name: Publish paired release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci-deploy.py publish
