name: Validate Windows client and Linux server

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  linux-server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .tools/godot-linux
          key: godot-linux-4.7.2-v1
      - name: Set up Linux Godot
        run: bash tools/server.sh setup
      - name: Test dedicated server
        run: bash tools/server.sh check
      - name: Test deployment safety
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y age
          python3 -m unittest discover -s tests -p 'deployment_test.py' -v
      - name: Package checked Linux release
        run: |
          bash tools/deploy-server.sh "$GITHUB_SHA"
          tar --exclude='./.godot' --exclude='./build' --exclude='*.zip' \
            -czf server.tar.gz -C "build/server-releases/$GITHUB_SHA" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Dorbit-Linux-${{ github.sha }}
          path: server.tar.gz
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Cache pinned Godot tools
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .tools/godot
            .tools/templates
          key: godot-windows-4.7.2-v1
      - name: Set up Godot
        shell: pwsh
        run: ./tools/dev.ps1 setup
      - name: Import and test the encounter
        shell: pwsh
        run: ./tools/dev.ps1 check
      - name: Export Windows build
        shell: pwsh
        run: ./tools/dev.ps1 build
      - name: Upload playable build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Dorbit-Windows-${{ github.sha }}
          path: build/windows/
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [linux-server, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Dorbit-Linux-${{ github.sha }}
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Dorbit-Windows-${{ github.sha }}
          path: client
      - name: Publish paired release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "$GITHUB_SHA" > client/REVISION
          (cd client && zip -qr ../dist/windows.zip .)
          python3 tools/ci-deploy.py publish
